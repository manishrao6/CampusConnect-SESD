{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<section class="form-page"><div class="container form-container"><a class="back-link" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-arrow-left"></i> Dashboard</a><div class="form-page-heading"><span class="section-kicker">EVENT MANAGEMENT</span><h1>{{ page_title }}</h1><p>Add clear details so students know exactly what to expect.</p></div>
<form method="post" class="event-editor">
<div class="editor-section"><h2><span>01</span> Event basics</h2><div class="row g-3"><div class="col-md-8"><label class="form-label">Event title *</label><input class="form-control" name="title" required value="{{ event.title }}" placeholder="e.g. Annual Tech Fest"></div><div class="col-md-4"><label class="form-label">Category *</label><select class="form-select" name="category" required>{% for category in ['Technical','Cultural','Sports','Social','Workshop','Other'] %}<option value="{{ category }}" {% if event.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Description *</label><textarea class="form-control" name="description" rows="4" required placeholder="What is the event about?">{{ event.description }}</textarea></div></div></div>
<div class="editor-section"><h2><span>02</span> When & where</h2><div class="row g-3"><div class="col-md-4"><label class="form-label">Date *</label><input class="form-control" type="date" name="event_date" required value="{{ event.event_date }}"></div><div class="col-md-4"><label class="form-label">Start time *</label><input class="form-control" type="time" name="event_time" required value="{{ event.event_time }}"></div><div class="col-md-4"><label class="form-label">Seat capacity *</label><input class="form-control" type="number" min="1" name="capacity" required value="{{ event.capacity }}"></div><div class="col-md-6"><label class="form-label">Venue *</label><input class="form-control" name="venue" required value="{{ event.venue }}" placeholder="Building / hall / ground"></div><div class="col-md-6"><label class="form-label">Organizer *</label><input class="form-control" name="organizer" required value="{{ event.organizer }}" placeholder="Club or department"></div></div></div>
<div class="editor-actions"><a class="btn btn-light btn-lg" href="{{ url_for('admin_dashboard') }}">Cancel</a><button class="btn btn-primary btn-lg" type="submit">{{ submit_label }} <i class="bi bi-arrow-right ms-2"></i></button></div>
</form></div></section>
{% endblock %}
