{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><div class="auth-icon"><i class="bi bi-shield-lock"></i></div><span class="section-kicker">ADMINISTRATION</span><h1>Welcome back.</h1><p class="muted">Sign in to manage campus events and registrations.</p>
<form method="post" class="mt-4"><label class="form-label" for="username">Username</label><input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required placeholder="Admin username"><label class="form-label mt-3" for="password">Password</label><input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required placeholder="Admin password"><button class="btn btn-primary btn-lg w-100 mt-4" type="submit">Sign in <i class="bi bi-arrow-right ms-2"></i></button></form>
<div class="demo-credentials"><i class="bi bi-info-circle"></i><div><strong>Demo credentials</strong><br><span>Username: admin · Password: admin123</span></div></div>
<a href="{{ url_for('index') }}" class="back-link mt-4 d-inline-block"><i class="bi bi-arrow-left"></i> Back to events</a></div></section>
{% endblock %}
